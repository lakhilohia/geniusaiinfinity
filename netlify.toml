# Netlify configuration for CoserveU (static, offline-first)
[build]
  publish = "."

# Serve the service worker with no cache so updates propagate.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
